name: Recovery Validation

on:
  push:
    branches:
      - recovery/p0-security-clean
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/recovery-validation.yml"
      - "RECOVERY_NOTES.md"
      - "OPERATOR_CHECKLIST.md"
      - "scripts/staged-upstream-cherry-pick.sh"
      - "src/**"
      - "extensions/**"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: recovery-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-check:
    name: recovery/pnpm-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check
        run: pnpm check

  tsgo:
    name: recovery/tsgo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tsgo
        run: pnpm tsgo

  low-profile-tests:
    name: recovery/low-profile-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run low-profile tests
        env:
          OPENCLAW_TEST_PROFILE: low
          OPENCLAW_TEST_SERIAL_GATEWAY: "1"
        run: pnpm test
